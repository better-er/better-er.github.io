        <div class="file">

        <div class="file">
            <div class="icon">📜</div>
            <div class="meta">

        <!-- ====== Synthesizer V 脚本 ====== -->
        <div class="file" data-path="离线小工具/sv_歌词-粘贴所选音符歌词(保留-+，按字符隔开).js">
            <div class="icon">🎵</div>

    <div class="footer">
        <a href="index.html">返回首页</a>
    </div>
</div>

<script>
(async function() {
    // 预先加载所有蓝图文件内容
    const fileMap = {};
    const fileEls = document.querySelectorAll('.file');
    for (const el of fileEls) {
        const path = el.dataset.path;
        try {
            const resp = await fetch(path);
            fileMap[path] = await resp.text();
        } catch (e) {
            console.error('加载失败:', path, e);
        }
    }

    // 复制按钮逻辑
    document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const fileEl = this.closest('.file');
            const path = fileEl.dataset.path;
            const text = fileMap[path];
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const orig = this.textContent;
                this.textContent = '已复制 ✓';
                setTimeout(() => this.textContent = orig, 1500);
            }).catch(() => {
                // 降级方案：创建临时 textarea
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                const orig = this.textContent;
                this.textContent = '已复制 ✓';
                setTimeout(() => this.textContent = orig, 1500);
            });
        });
    });

})();
</script>
</body>
