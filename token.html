<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <title id="page-title"></title>
    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --border-light: #dee2e6;
            --accent: #4a6fa5;
            --alert: #f8d7da;
            --alert-border: #dc3545;
            --hover-overlay: rgba(0, 0, 0, 0.03);
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 20px;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            line-height: 1.4;
            font-size: 0.9rem;
        }

        h2 {
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
            display: inline-block;
            font-size: 1.6rem;
        }

        /* 输入框基础样式（紧凑型） */
        textarea {
            font-family: 'Consolas', 'Menlo', 'Monaco', monospace;
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            max-height: 40vh;
            overflow-y: auto;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(74, 111, 165, 0.2);
        }

        /* 主容器：单一模式布局 */
        .multi-container {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
        }

        .multi-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: 10px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.04);
            padding: 16px;
        }

        .multi-box h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1rem;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
            font-weight: 600;
        }

        /* 预览标题：包含不匹配计数 */
        .multi-preview-title {
            display: flex;
            align-items: center;
            font-size: 1rem;
            color: var(--text-primary);
            margin: 20px 0 12px;
            padding-left: 4px;
            border-left: 3px solid var(--accent);
        }

        .multi-preview-title .mismatch-count {
            background: var(--alert);
            color: var(--alert-border);
            font-weight: bold;
            font-size: 0.9rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
            min-width: 24px;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            white-space: nowrap;
        }

        /* 对齐预览容器 */
        .multi-preview {
            padding: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            font-family: 'Consolas', 'Menlo', 'Monaco', monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            border-left: 3px solid var(--accent);
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.04);
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        /* 每一对音节行 */
        .pair-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
            margin-bottom: 6px;
            white-space: nowrap;
            padding: 4px 8px;
            border-radius: 6px;
            position: relative;
            margin-left: -20px;
            padding-left: 20px;
        }

        /* 不匹配行：左侧添加警告图标 */
        .pair-row.mismatch::before {
            content: "❗";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: var(--alert-border);
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 1px #fff;
            pointer-events: none;
        }

        .pair-row.mismatch {
            background: var(--alert);
            border-left: 3px solid var(--alert-border);
            margin-left: -20px;
            padding-left: 20px;
        }

        .pair {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 3px 6px;
            min-width: 25px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        .pair:hover {
            background: var(--hover-overlay);
        }

        .top {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
            margin-bottom: 1px;
        }

        .bottom {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .mismatch .top,
        .mismatch .bottom {
            color: #721c24 !important;
        }

        /* 提示文本 */
        p.small {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin: 12px 0;
            line-height: 1.7;
        }

        /* 滚动条优化 */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-light);
        }

        /* 响应式微调 */
        @media (max-width: 768px) {
            body {
                margin: 12px;
                font-size: 0.9rem;
            }
            .multi-container {
                flex-direction: column;
            }
            .multi-box {
                margin-bottom: 16px;
            }
        }
    </style>
</head>
<body>
<h2 id="main-title"></h2>

<!-- 单一模式，无标签页 -->
<div id="multi-mode">
    <p class="small" id="multi-desc"></p>

    <div class="multi-container">
        <div class="multi-box">
            <h3 id="label-original"></h3>
            <textarea id="multi-input1"></textarea>
        </div>
        <div class="multi-box">
            <h3 id="label-new"></h3>
            <textarea id="multi-input2"></textarea>
        </div>
    </div>

    <h3 id="multi-preview-title" class="multi-preview-title">
        填词对齐音节预览
        <span class="mismatch-count">0</span>
    </h3>

    <div id="multi-preview" class="multi-preview"></div>
</div>

<script>
    /**
     * ===================================================
     * 常量：所有显示文本
     * ===================================================
     */
    const TEXT = {
        PAGE_TITLE: '填词音节对齐辅助',
        MAIN_TITLE: '填词音节对齐辅助',
        LABEL_ORIGINAL: '原词：',
        LABEL_NEW: '新词：',
        MULTI_DESC: '逐行对齐显示（不匹配行将显示❗并统计），配合SV保留延音符粘贴歌词脚本使用，原词不可有延音符，适配中日英',
        MULTI_PREVIEW_TITLE: '填词对齐音节预览',
        DEFAULT_MULTI_INPUT1: `このままじゃいけない
そうね 知っているわ
wake up wake up babe don't fe ar
君みの碧おい瞳とみの中かに あ わたしはいたい`,
        DEFAULT_MULTI_INPUT2: `祥子长的角真-好看
光-芒 抓起-丢出
顶灯照耀每一个人
u mi ri 甩开了蒙在她脸上的面纱 祥子 转向键盘外`
    };

    /**
     * ===================================================
     * App 主逻辑
     * ===================================================
     */
    const STORAGE_KEY = 'token_tool_data';

    const App = {
        els: {
            multiMode: document.getElementById('multi-mode'),
            multiInput1: document.getElementById('multi-input1'),
            multiInput2: document.getElementById('multi-input2'),
            multiPreview: document.getElementById('multi-preview'),
            mismatchCount: document.querySelector('.mismatch-count')
        },

        /**
         * 初始化应用
         */
        init() {
            this.setupText();
            this.loadData();
            this.bindEvents();
            this.renderAlignedPairs();
        },

        setupText() {
            document.title = TEXT.PAGE_TITLE;
            document.getElementById('page-title').textContent = TEXT.PAGE_TITLE;
            document.getElementById('main-title').textContent = TEXT.MAIN_TITLE;
            document.getElementById('multi-desc').textContent = TEXT.MULTI_DESC;
            document.getElementById('label-original').textContent = TEXT.LABEL_ORIGINAL;
            document.getElementById('label-new').textContent = TEXT.LABEL_NEW;
        },

        /**
         * 自动保存所有数据到 localStorage
         */
        saveData() {
            const multi = {
                input1: this.els.multiInput1.value,
                input2: this.els.multiInput2.value
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify({multi}));
        },

        /**
         * 自动加载数据
         */
        loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
                this.els.multiInput1.value = TEXT.DEFAULT_MULTI_INPUT1;
                this.els.multiInput2.value = TEXT.DEFAULT_MULTI_INPUT2;
                return;
            }
            try {
                const {multi} = JSON.parse(raw);
                if (multi) {
                    this.els.multiInput1.value = multi.input1 || '';
                    this.els.multiInput2.value = multi.input2 || '';
                }
            } catch (e) {}
        },

        /**
         * 分词函数：
         * - 英文字母连续时合并为一个单词（以空白符结束单词）
         * - 空白符在非英文情况下忽略
         * - 其他字符（中文/日文/符号/标点等）按字符分隔
         * - 小假名（拗音、促音等）会附加到前一个 token 上（例如ゃゅょ、っ）
         * - 支持 splitCJK 参数：若为 true 则按字符分隔 CJK；若为 false 则连续的 CJK 字符合并为一个 token
         * 返回值与旧实现兼容：数组，元素为 {text: '...'}
         */
        tokenize(line, splitCJK = true) {
            const tokens = [];
            let currentWord = '';
            let isInEnglish = false;

            const smallKana = /[ぁぃぅぇぉゃゅょゎっァィゥェォヵヶャュョヮッ]/;
            const isCJKChar = (c) => /[\u4E00-\u9FFF]/.test(c) || /[\u3040-\u309F]/.test(c) || /[\u30A0-\u30FF]/.test(c);

            for (let i = 0; i < line.length; i++) {
                const c = line[i];

                if (/[a-zA-Z']/.test(c)) {
                    // 英文字母或撇号继续累积为同一个英文单词
                    currentWord += c;
                    isInEnglish = true;
                    continue;
                }

                if (/\s/.test(c)) {
                    // 空白符：若正在构建英文单词，则结束该单词；否则忽略
                    if (isInEnglish && currentWord) {
                        tokens.push({text: currentWord});
                        currentWord = '';
                        isInEnglish = false;
                    }
                    continue;
                }

                // 到这里说明当前字符不是英文字母也不是空白
                // 若之前处于英文单词，则先结束该单词
                if (isInEnglish && currentWord) {
                    tokens.push({text: currentWord});
                    currentWord = '';
                    isInEnglish = false;
                }

                // 小假名需附加到前一个 token（如果存在）
                if (smallKana.test(c) && tokens.length > 0) {
                    tokens[tokens.length - 1].text += c;
                    continue;
                }

                // 根据 split 参数处理 CJK —— 若 split=true 则单个字符为 token；否则尝试合并连续 CJK
                if (isCJKChar(c)) {
                    if (splitCJK) {
                        tokens.push({text: c});
                    } else {
                        // 若前一个 token 存在且是 CJK（全部由 CJK 组成），则合并
                        const last = tokens[tokens.length - 1];
                        if (last && isCJKChar(last.text[last.text.length - 1]) && /^[\u4E00-\u9FFF\u3040-\u309F\u30A0-\u30FF]+$/.test(last.text)) {
                            last.text += c;
                        } else {
                            tokens.push({text: c});
                        }
                    }
                    continue;
                }

                // 其他符号/标点/数字等，单字符作为 token（保留 '-' 和 '+' 等）
                tokens.push({text: c});
            }

            // 遍历结束后，如果还有残留的英文单词，加入返回数组
            if (isInEnglish && currentWord) {
                tokens.push({text: currentWord});
            }

            return tokens;
        },

        /**
         * 渲染对齐结果，并更新不匹配计数
         */
        renderAlignedPairs() {
            const container = this.els.multiPreview;
            const input1 = this.els.multiInput1.value.split('\n');
            const input2 = this.els.multiInput2.value.split('\n');
            const maxLen = Math.max(input1.length, input2.length);

            let mismatchCount = 0;
            container.innerHTML = '';

            for (let i = 0; i < maxLen; i++) {
                const line1 = (input1[i] || '').trim();
                const line2 = (input2[i] || '').trim();

                const tokens1 = this.tokenize(line1);
                const tokens2 = this.tokenize(line2);

                const row = document.createElement('div');
                row.className = 'pair-row';
                if (tokens1.length !== tokens2.length) {
                    row.classList.add('mismatch');
                    mismatchCount++;
                }

                const maxTokenLen = Math.max(tokens1.length, tokens2.length);
                for (let j = 0; j < maxTokenLen; j++) {
                    const t1 = tokens1[j] || {text: ''};
                    const t2 = tokens2[j] || {text: ''};

                    const pair = document.createElement('div');
                    pair.className = 'pair';

                    const top = document.createElement('span');
                    top.className = 'top';
                    top.textContent = t1.text;

                    const bottom = document.createElement('span');
                    bottom.className = 'bottom';
                    bottom.textContent = t2.text;

                    pair.appendChild(top);
                    pair.appendChild(bottom);
                    row.appendChild(pair);
                }

                container.appendChild(row);
                if (i < maxLen - 1) {
                    container.appendChild(document.createElement('br'));
                }
            }

            // 更新标题右侧的不匹配计数
            this.els.mismatchCount.textContent = mismatchCount;
        },

        /**
         * 绑定输入事件
         */
        bindEvents() {
            const update = () => {
                autoResizeTextarea(this.els.multiInput1);
                autoResizeTextarea(this.els.multiInput2);
                this.renderAlignedPairs();
                this.saveData();
            };

            this.els.multiInput1.addEventListener('input', update);
            this.els.multiInput2.addEventListener('input', update);

            // 初始渲染
            update();
        }
    };

    /**
     * 自动调整 textarea 高度
     */
    function autoResizeTextarea(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
    }

    // ========== 启动应用 ==========
    window.addEventListener('DOMContentLoaded', () => App.init());
</script>

</body>
</html>
