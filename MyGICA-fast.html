<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MyGICA-fast 图片速览</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            padding: 40px 32px;
        }

        h2 {
            margin: 0 0 24px 0;
            color: #222;
            font-weight: 600;
            font-size: 28px;
            text-align: center;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 36px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls label {
            font-weight: 600;
            font-size: 16px;
            color: #555;
            white-space: nowrap;
        }

        select {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 12px;
            border: 1px solid #e1e5e9;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus {
            outline: none;
            border-color: #4c9eff;
            box-shadow: 0 0 0 2px rgba(76, 158, 255, 0.25);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .gallery.single-col {
            grid-template-columns: 1fr;
            gap: 0;
            margin: 0;
            padding: 0;
            width: 100vw;
            position: relative;
        }

        .gallery-item {
            background: #fafafa;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #f0f0f0;
            position: relative;
        }

        .gallery-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            transition: all 0.4s ease;
        }

        /* 单列模式：全屏图片 */
        .gallery.single-col .gallery-item {
            border-radius: 0;
            border: none;
            box-shadow: none;
            background: #000;
            margin: 0;
            padding: 0;
        }

        .gallery.single-col .gallery-item img {
            width: 100vw;
            max-width: 100vw;
            height: auto;
            max-height: none;
            object-fit: contain;
            background: #000;
            display: block;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* 图片编号标签（单列模式） */
        .gallery.single-col .gallery-item .img-number {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            z-index: 10;
            pointer-events: none;
        }

        /* 缩略图加载提示 */
        .gallery-item .thumb-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 16px;
            text-align: center;
            pointer-events: none;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        /* 模态窗：全屏预览 */
        .img-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: #000;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0;
            margin: 0;
        }

        .img-modal.active {
            display: flex;
        }

        .img-modal img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            background: #000;
            display: block;
            margin: 0 auto;
            box-shadow: none;
            border-radius: 0;
            pointer-events: none;
        }

        .img-modal .close {
            position: absolute;
            top: 24px;
            right: 32px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            z-index: 10001;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
            transition: all 0.2s;
        }

        .img-modal .close:hover {
            color: #ff6b6b;
            transform: scale(1.1);
        }

        /* 响应式优化：小屏适应 */
        @media (max-width: 768px) {
            .container {
                margin: 40px 16px;
                padding: 28px 20px;
            }

            .controls {
                gap: 20px;
                flex-direction: column;
                align-items: stretch;
            }

            select {
                width: 100%;
            }

            .gallery.single-col .gallery-item img {
                height: auto;
                min-height: 0;
            }

            .img-modal .close {
                top: 16px;
                right: 16px;
                font-size: 32px;
            }
        }

        .mygo {
            color: #3388BB;
        }

        .mujica {
            color: #881144;
        }
    </style>
</head>
<body>
<div class="container">
    <h2><span class="mygo">MyG</span><span class="mujica">ICA</span>-fast 图片速览</h2>
    <div class="controls">
        <label for="folderSelect">选择作品：</label>
        <select id="folderSelect">
            <option value="MyGO">MyGO</option>
            <option value="Mujica">Mujica</option>
            <option value="LycoReco">LycoReco</option>
        </select>
        <label for="modeSelect">展示方式：</label>
        <select id="modeSelect">
            <option value="all">全部（一次性加载）</option>
            <option value="thumb" selected>缩略图（点加载+放大）</option>
        </select>
    </div>
    <div class="gallery" id="gallery"></div>
</div>
<div class="img-modal" id="imgModal">
    <span class="close" id="modalClose">&times;</span>
    <img id="modalImg" src="" alt="预览"/>
</div>

<script>
    const imageMap = {
        MyGO: [
            'MyGICA-fast/MyGO/mygo_changes_01.jpg',
            'MyGICA-fast/MyGO/mygo_changes_02.jpg',
            'MyGICA-fast/MyGO/mygo_changes_03.jpg',
            'MyGICA-fast/MyGO/mygo_changes_04.jpg',
            'MyGICA-fast/MyGO/mygo_changes_05.jpg',
            'MyGICA-fast/MyGO/mygo_changes_06.jpg',
            'MyGICA-fast/MyGO/mygo_changes_07.jpg',
            'MyGICA-fast/MyGO/mygo_changes_08.jpg',
            'MyGICA-fast/MyGO/mygo_changes_09.jpg',
            'MyGICA-fast/MyGO/mygo_changes_10.jpg',
            'MyGICA-fast/MyGO/mygo_changes_11.jpg',
            'MyGICA-fast/MyGO/mygo_changes_12.jpg',
            'MyGICA-fast/MyGO/mygo_changes_13.jpg',
        ],
        Mujica: [
            'MyGICA-fast/Mujica/mujica_changes_01.jpg',
            'MyGICA-fast/Mujica/mujica_changes_02.jpg',
            'MyGICA-fast/Mujica/mujica_changes_03.jpg',
            'MyGICA-fast/Mujica/mujica_changes_04.jpg',
            'MyGICA-fast/Mujica/mujica_changes_05.jpg',
            'MyGICA-fast/Mujica/mujica_changes_06.jpg',
            'MyGICA-fast/Mujica/mujica_changes_07.jpg',
            'MyGICA-fast/Mujica/mujica_changes_08.jpg',
            'MyGICA-fast/Mujica/mujica_changes_09.jpg',
            'MyGICA-fast/Mujica/mujica_changes_10.jpg',
            'MyGICA-fast/Mujica/mujica_changes_11.jpg',
            'MyGICA-fast/Mujica/mujica_changes_12.jpg',
            'MyGICA-fast/Mujica/mujica_changes_13.jpg',
        ],
        LycoReco: [
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_01.jpg',
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_02.jpg',
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_03.jpg',
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_04.jpg',
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_05.jpg',
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_06.jpg',
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_07.jpg',
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_08.jpg',
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_09.jpg',
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_10.jpg',
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_11.jpg',
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_12.jpg',
            'MyGICA-fast/LycoReco/Lycoris Recoil_changes_13.jpg',
        ]
    };

    const folderSelect = document.getElementById('folderSelect');
    const modeSelect = document.getElementById('modeSelect');
    const gallery = document.getElementById('gallery');
    const imgModal = document.getElementById('imgModal');
    const modalImg = document.getElementById('modalImg');
    const modalClose = document.getElementById('modalClose');

    function renderGallery() {
        const folder = folderSelect.value;
        const mode = modeSelect.value;
        const images = imageMap[folder] || [];

        gallery.innerHTML = '';
        gallery.classList.toggle('single-col', mode === 'all');

        if (mode === 'all') {
            gallery.style.width = '100vw';
            gallery.style.marginLeft = 'calc(-1 * ((100vw - 100%) / 2))';
            gallery.style.marginRight = '0';

            images.forEach((src, idx) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';

                // 添加编号标签
                const num = document.createElement('div');
                num.className = 'img-number';
                num.textContent = (idx + 1).toString();
                item.appendChild(num);

                const img = document.createElement('img');
                img.src = src;
                img.alt = src.split('/').pop();
                item.appendChild(img);
                gallery.appendChild(item);
            });
        } else {
            gallery.style.width = '';
            gallery.style.marginLeft = '';
            gallery.style.marginRight = '';

            images.forEach(src => {
                const item = document.createElement('div');
                item.className = 'gallery-item';

                const img = document.createElement('img');
                img.alt = src.split('/').pop();
                img.setAttribute('data-src', src);
                img.src = '';
                img.style.filter = 'blur(8px)';
                img.style.background = '#f5f5f5';
                img.style.transition = 'all 0.4s ease';

                const tip = document.createElement('div');
                tip.className = 'thumb-tip';
                tip.textContent = '点击加载图片';
                item.style.position = 'relative';
                item.appendChild(img);
                item.appendChild(tip);

                let loaded = false;
                item.onclick = () => {
                    if (!loaded) {
                        img.src = src;
                        img.onload = () => {
                            img.style.filter = 'none';
                            img.style.background = 'transparent';
                            tip.style.opacity = '0';
                            setTimeout(() => tip.remove(), 300);
                            loaded = true;
                        };
                    } else {
                        modalImg.src = src;
                        imgModal.classList.add('active');
                    }
                };

                gallery.appendChild(item);
            });
        }
    }

    folderSelect.onchange = renderGallery;
    modeSelect.onchange = renderGallery;

    modalClose.onclick = () => {
        imgModal.classList.remove('active');
        modalImg.src = '';
    };

    imgModal.onclick = (e) => {
        if (e.target === imgModal) {
            imgModal.classList.remove('active');
            modalImg.src = '';
        }
    };

    // 初始化
    renderGallery();
</script>
</body>
</html>
