<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MyGICA-fast 图片速览</title>
    <script defer src="/assets/js/back-to-home.js"></script>
    <link rel="stylesheet" href="assets/css/mygica.css">
</head>
<body>
<div class="container">
    <h2><span class="mygo">MyG</span><span class="mujica">ICA</span>-fast 图片速览</h2>
    <div class="controls">
        <label for="folderSelect">选择作品：</label>
        <select id="folderSelect">
            <option value="MyGO">MyGO</option>
            <option value="Mujica">Mujica</option>
            <option value="LycoReco">LycoReco</option>
        </select>
        <label for="modeSelect">展示方式：</label>
        <select id="modeSelect">
            <option value="all">全部（一次性加载）</option>
            <option value="thumb" selected>缩略图（点加载+放大）</option>
        </select>
    </div>
    <div class="gallery" id="gallery"></div>
</div>
<script type="module" src="assets/js/mygica.js"></script>
</body>
</html>
