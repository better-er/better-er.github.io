<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武器基质属性筛选器</title>
    <script defer src="/assets/js/back-to-home.js"></script>
    <link rel="stylesheet" href="assets/css/weapons.css">
</head>
<body>
<div class="container">
    <h1>武器基质属性筛选器</h1>
    <div class="update-time">更新时间：1.0开服版本</div>
    <div class="loading-info" id="loading-info">正在加载武器数据...</div>

    <!-- 分类标签组 -->
    <div class="category">
        <h2>基础属性</h2>
        <div class="tag-container" id="base-attributes">
            <!-- 动态生成 -->
        </div>
    </div>

    <div class="category">
        <h2>附加属性</h2>
        <div class="tag-container" id="additional-attributes">
            <!-- 动态生成 -->
        </div>
    </div>

    <div class="category">
        <h2>技能属性</h2>
        <div class="tag-container" id="skill-attributes">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
        <!-- 新增：刻写券模式开关 -->
        <label>
            <input type="checkbox" id="mode-kexie">
            <span>刻写券模式</span>
        </label>
        <button class="btn-clear" id="btn-clear">清空选择</button>
        <button class="btn-see-all" id="btn-see-all" style="display: none;">我就要看</button>
        <button class="btn-same-skills" id="btn-same-skills">技能相同的武器</button>
    </div>

    <div class="status" id="status">请选择恰好 3 个属性进行筛选</div>

    <div class="results" id="results">
        <!-- 动态渲染结果 -->
    </div>
</div>

<script src="assets/js/weapons.js" defer></script>
</body>
</html>
